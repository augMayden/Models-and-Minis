openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: >
    REST API for the marketplace, backed by MongoDB (Mongoose).
    Authenticate via POST /api/auth/login, then send `Authorization: Bearer <token>`.
servers:
  - url: http://127.0.0.1:4000
    description: Local
  - url: http://10.8.0.3:4000
    description: LAN

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Listings
  - name: Cart
  - name: Orders
  - name: Admin

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  ts: { type: string, format: date-time }

  /api/auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register a Buyer or Seller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                role: { type: string, enum: [Buyer, Seller], default: Buyer }
                username: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: email or username }
                password: { type: string, format: password }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      summary: Request a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Always returns ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }

  /api/users/me:
    get:
      tags: [Users]
      summary: Get the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Users]
      summary: Update the current user's profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                email: { type: string, format: email }
                address: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/users/{id}:
    get:
      tags: [Users]
      security: []
      summary: Public user profile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id: { type: string }
                  username: { type: string }
                  role: { type: string, enum: [Seller, Admin, Buyer] }
                  registerDate: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/listings:
    get:
      tags: [Listings]
      security: []
      summary: Search listings
      parameters:
        - { name: q, in: query, schema: { type: string }, description: full-text search }
        - { name: theme, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [Active, Pending, Removed], default: Active } }
        - { name: min, in: query, schema: { type: number } }
        - { name: max, in: query, schema: { type: number } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Listing" }
    post:
      tags: [Listings]
      summary: Create a listing (Seller)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/listings/{id}:
    get:
      tags: [Listings]
      security: []
      summary: Get one listing
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Listings]
      summary: Update a listing (Seller owner or Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Listings]
      summary: Soft-delete a listing (Seller owner or Admin) -> status Removed
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/cart:
    get:
      tags: [Cart]
      summary: Get the buyer's cart
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Cart]
      summary: Clear the cart
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /api/cart/items:
    post:
      tags: [Cart]
      summary: Add a listing to the cart (Buyer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId]
              properties:
                listingId: { type: string }
                quantity: { type: integer, default: 1, minimum: 1 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/cart/items/{cartItemId}:
    delete:
      tags: [Cart]
      summary: Remove a cart line item
      parameters:
        - { name: cartItemId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/orders/checkout:
    post:
      tags: [Orders]
      summary: Convert the cart into an order (Buyer)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentId: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/orders:
    get:
      tags: [Orders]
      summary: List orders (Buyer = own; Seller = orders with their items)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get one order (owner buyer, seller with items, or admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Orders]
      summary: Update fulfillment (Seller or Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fulfillmentState:
                  type: string
                  enum: [Open, Processing, Shipped, Delivered, Cancelled]
                shippingInfo: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/overview:
    get:
      tags: [Admin]
      summary: Site-wide counts (Admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: integer }
                  listings: { type: integer }
                  orders: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/accounts:
    get:
      tags: [Admin]
      summary: List all accounts (Admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }

  /api/admin/accounts/{id}/approve:
    post:
      tags: [Admin]
      summary: Approve an account (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }

  /api/admin/accounts/{id}/deny:
    post:
      tags: [Admin]
      summary: Deny an account (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }

  /api/admin/accounts/{id}/ban:
    post:
      tags: [Admin]
      summary: Ban an account (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }

  /api/admin/listings:
    get:
      tags: [Admin]
      summary: List listings, optional status filter (Admin)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [Pending, Active, Removed] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Listing" }

  /api/admin/listings/{id}/approve:
    post:
      tags: [Admin]
      summary: Approve a listing -> status Active (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Wrong role or banned
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: Forbidden }

    Address:
      type: object
      required: [line1, city, postalCode]
      properties:
        label: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string, default: US }

    User:
      type: object
      properties:
        _id: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        accountType: { type: string, enum: [Pending, Active, Banned] }
        role: { type: string, enum: [Seller, Admin, Buyer] }
        registerDate: { type: string, format: date-time }
        shippingAddresses:
          type: array
          items: { $ref: "#/components/schemas/Address" }
        paymentMethods:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        earnings: { type: number, description: Seller only }
        adminLevel: { type: integer, description: Admin only }

    ListingInput:
      type: object
      required: [name, price, stock]
      properties:
        name: { type: string }
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        description: { type: string }
        image: { type: string }
        scale: { type: string }
        theme: { type: string }
        status: { type: string, enum: [Pending, Active, Removed] }

    Listing:
      type: object
      properties:
        _id: { type: string }
        seller:
          oneOf:
            - type: string
            - type: object
              properties:
                _id: { type: string }
                username: { type: string }
                role: { type: string }
        name: { type: string }
        price: { type: number }
        stock: { type: integer }
        description: { type: string }
        image: { type: string }
        scale: { type: string }
        theme: { type: string }
        status: { type: string, enum: [Pending, Active, Removed] }
        creationDate: { type: string, format: date-time }

    CartItem:
      type: object
      properties:
        _id: { type: string }
        listing: { oneOf: [{ type: string }, { $ref: "#/components/schemas/Listing" }] }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }

    Cart:
      type: object
      properties:
        _id: { type: string }
        buyer: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }
        total: { type: number }

    OrderItem:
      type: object
      properties:
        _id: { type: string }
        listing: { oneOf: [{ type: string }, { $ref: "#/components/schemas/Listing" }] }
        quantity: { type: integer }
        unitPrice: { type: number }
        seller: { type: string }

    Order:
      type: object
      properties:
        _id: { type: string }
        buyer: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        total: { type: number }
        fulfillmentState:
          type: string
          enum: [Open, Processing, Shipped, Delivered, Cancelled]
        shippingInfo: { type: string }
        payment: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Payment:
      type: object
      properties:
        _id: { type: string }
        methodType: { type: string, example: card }
        isDefault: { type: boolean }
        owner: { type: string }
        ownerModel: { type: string, enum: [Buyer, Seller] }
